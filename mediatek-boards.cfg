#
# MediaTek Filogic board table - pairs a U-Boot defconfig with the TF-A
# (atf-mtksoc) configuration that turns this tree's u-boot.bin into a
# flashable firmware.
#
# Unlike the Airoha SoCs, a MediaTek Filogic firmware is not produced by this
# repository alone.  mediatek.sh builds U-Boot, then hands u-boot.bin over to
# the TF-A tree as BL33, which links it with BL2/BL31 and emits the two
# artifacts a device needs:
#
#   preloader.bin     <- atf-mtksoc build/<plat>/release/bl2.img
#   bl31-uboot.fip    <- atf-mtksoc build/<plat>/release/fip.bin
#
# This file is what makes that handover unambiguous: one block per U-Boot
# defconfig, recording the TF-A configuration that was built and validated
# against exactly that board.
#
# Block name
#   The U-Boot defconfig basename, i.e. configs/<name>_defconfig with the
#   "_defconfig" suffix stripped (for example mt7981_qihoo-360t7-ubi).
#
# Fields
#   NAME          Human readable board name (printed by the script).
#   BL2_BOOTCFG   TF-A boot device plus the NAND bad block management, in the
#                 "<device>[-<spi>]-<management>" form used by the TF-A
#                 defconfig names.  Examples:
#                   spim-nand-ubi   SPI-NAND on SPIM, UBI layout
#                   spim-nand       SPI-NAND on SPIM, NMBM layout
#                   snfi-nand-ubi   SPI-NAND on SNFI, UBI layout
#                   emmc            eMMC
#                   nor             SPI-NOR
#                 Leave empty when TF-A has no counterpart for the board.
#   BL2_DRAM      TF-A DRAM type: ddr3 | ddr4 | ddr-comb.  Leave empty for the
#                 SoCs whose TF-A configuration auto-detects DRAM (MT7987).
#   ATF_CONFIG    Optional.  Full TF-A defconfig name, used when the derived
#                 name does not apply (for example the MT7988 RFB).
#   GPT           Optional.  Space-separated list of partition table layouts
#                 that are flashed as a separate image, generated by
#                 tools/ptgen: "emmc" and/or "sdmmc".  Only boards that boot
#                 from eMMC/SD need one; leave it out otherwise.
#
# The TF-A defconfig is derived as
#
#   <soc>_<BL2_BOOTCFG, '-' -> '_'>[_<BL2_DRAM>]_defconfig
#
# so, for example, mt7981_rfb-ubi with "spim-nand-ubi" + "ddr3"
# resolves to configs/mt7981_spim_nand_ubi_ddr3_defconfig.
#
# Keep the blocks sorted by SoC, then by board name.

# ---- MT7981 -----------------------------------------------------------------

define mt7981_cmcc_rax3000m-emmc
  NAME:=CMCC RAX3000M (eMMC)
  BL2_BOOTCFG=emmc
  BL2_DRAM=ddr4
  GPT=emmc
endef

define mt7981_cmcc_rax3000m-ubi
  NAME:=CMCC RAX3000M (UBI)
  BL2_BOOTCFG=spim-nand-ubi
  BL2_DRAM=ddr4
endef

define mt7981_comfast_cf-wr632ax-ubi
  NAME:=COMFAST CF-WR632AX (UBI)
  BL2_BOOTCFG=spim-nand-ubi
  BL2_DRAM=ddr3-1866
endef

define mt7981_creatlentem_clt-r30b1-ubi
  NAME:=Creatlentem CLT-R30B1 (UBI)
  BL2_BOOTCFG=spim-nand-ubi
  BL2_DRAM=ddr3-1866
endef

define mt7981_emmc_rfb
  NAME:=MediaTek MT7981 eMMC RFB
  BL2_BOOTCFG=emmc
  BL2_DRAM=ddr4
  GPT=emmc
endef

define mt7981_qihoo_360t7-ubi
  NAME:=Qihoo 360T7 (UBI)
  BL2_BOOTCFG=spim-nand-ubi
  BL2_DRAM=ddr3-1866
endef

define mt7981_rfb
  NAME:=MediaTek MT7981 RFB
  BL2_BOOTCFG=spim-nand
  BL2_DRAM=ddr3
endef

define mt7981_rfb-ubi
  NAME:=MediaTek MT7981 RFB (UBI)
  BL2_BOOTCFG=spim-nand-ubi
  BL2_DRAM=ddr3
endef

define mt7981_sd_rfb
  NAME:=MediaTek MT7981 SD RFB
  # TF-A only ships an eMMC image for MT7981, so there is nothing to pair an
  # SD boot with yet.
  BL2_BOOTCFG=
  GPT=sdmmc
endef

define mt7981_sn_r1
  NAME:=SN R1
  BL2_BOOTCFG=emmc
  BL2_DRAM=ddr4
  GPT=emmc
endef

define mt7981_zbt_z8103ax-ubi
  NAME:=ZBT Z8103AX (UBI)
  BL2_BOOTCFG=spim-nand-ubi
  BL2_DRAM=ddr3-1866
endef

# ---- MT7986 -----------------------------------------------------------------

define mt7986_rfb
  NAME:=MediaTek MT7986 RFB
  BL2_BOOTCFG=spim-nand
  BL2_DRAM=ddr4
endef

define mt7986_rfb-ubi
  NAME:=MediaTek MT7986 RFB (UBI)
  BL2_BOOTCFG=spim-nand-ubi
  BL2_DRAM=ddr4
endef

define mt7986_ruijie_rg-x60-new-ubi
  NAME:=Ruijie RG-X60 (new, UBI)
  BL2_BOOTCFG=spim-nand-ubi
  BL2_DRAM=ddr3
endef

define mt7986a_bpir3_emmc
  NAME:=Banana Pi R3 (eMMC)
  BL2_BOOTCFG=emmc
  BL2_DRAM=ddr4
  GPT=emmc
endef

define mt7986a_bpir3_sd
  NAME:=Banana Pi R3 (SD)
  # TF-A only ships an eMMC image for MT7986, so there is nothing to pair an
  # SD boot with yet.
  BL2_BOOTCFG=
  GPT=sdmmc
endef

# ---- MT7987 -----------------------------------------------------------------

define mt7987_emmc_rfb
  NAME:=MediaTek MT7987 eMMC RFB
  BL2_BOOTCFG=emmc
  GPT=emmc
endef

define mt7987_rfb
  NAME:=MediaTek MT7987 RFB
  BL2_BOOTCFG=spim-nand-ubi
endef

define mt7987_sd_rfb
  NAME:=MediaTek MT7987 SD RFB
  # TF-A only ships an eMMC image for MT7987, so there is nothing to pair an
  # SD boot with yet.
  BL2_BOOTCFG=
  GPT=sdmmc
endef

# ---- MT7988 -----------------------------------------------------------------

define mt7988_rfb
  NAME:=MediaTek MT7988 RFB
  # The RFB TF-A configuration carries extra options (emergency memory dump)
  # that the derived mt7988_spim_nand_defconfig does not have.
  ATF_CONFIG=mt7988_rfb_spim_nand_defconfig
endef

define mt7988_sd_rfb
  NAME:=MediaTek MT7988 SD RFB
  # TF-A only ships SPI-NAND / SNFI images for MT7988, so there is nothing to
  # pair an SD boot with yet.
  BL2_BOOTCFG=
  GPT=sdmmc
endef
